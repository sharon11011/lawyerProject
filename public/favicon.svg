<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a2a6c"/>
  <!-- Book body -->
  <rect x="14" y="14" width="26" height="34" rx="2" fill="#b8860b"/>
  <!-- Book spine -->
  <rect x="14" y="14" width="5" height="34" rx="1" fill="#8b6508"/>
  <!-- Book pages (right side) -->
  <rect x="38" y="16" width="12" height="30" rx="1" fill="#f5f0e8"/>
  <rect x="38" y="16" width="1.5" height="30" fill="#e0d8c8"/>
  <!-- Lines on book cover -->
  <line x1="22" y1="24" x2="36" y2="24" stroke="#f5e6a3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="29" x2="36" y2="29" stroke="#f5e6a3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="36" y2="34" stroke="#f5e6a3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lines on pages -->
  <line x1="40" y1="22" x2="48" y2="22" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="26" x2="48" y2="26" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="30" x2="48" y2="30" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="34" x2="48" y2="34" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="38" x2="48" y2="38" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
</svg>
